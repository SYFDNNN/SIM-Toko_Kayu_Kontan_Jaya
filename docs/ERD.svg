  <text x="30" y="130" fill="#374151">  name</text>
  <text x="30" y="148" fill="#374151">  email (UNIQUE)</text>
  <text x="30" y="166" fill="#374151">  password (bcrypt)</text>
  <text x="30" y="184" fill="#374151">  role (owner|cashier)</text>
  <text x="30" y="202" fill="#374151">  is_active</text>
