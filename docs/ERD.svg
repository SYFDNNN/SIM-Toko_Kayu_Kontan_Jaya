  <text x="30" y="407" fill="#374151">  email</text>
  <text x="30" y="425" fill="#374151">  address</text>
  <text x="30" y="443" fill="#374151">  created_at</text>

  <!-- RELATIONSHIPS LINES -->
  <!-- categories → products -->
  <line x1="410" y1="135" x2="460" y2="135" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="415" y="130" font-size="10" fill="#6b7280">1</text>
  <text x="440" y="130" font-size="10" fill="#6b7280">N</text>

  <!-- users → transactions -->
  <line x1="200" y1="140" x2="460" y2="510" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- users → stock_movements -->
  <line x1="200" y1="100" x2="720" y2="148" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- products → transaction_details -->
  <line x1="660" y1="200" x2="810" y2="489" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- transactions → transaction_details -->
  <line x1="660" y1="530" x2="720" y2="510" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="664" y="526" font-size="10" fill="#6b7280">1</text>
  <text x="704" y="516" font-size="10" fill="#6b7280">N</text>

  <!-- products → stock_movements -->
  <line x1="720" y1="195" x2="660" y2="195" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="664" y="192" font-size="10" fill="#6b7280">N</text>
  <text x="706" y="192" font-size="10" fill="#6b7280">1</text>

  <!-- Legend -->
  <rect x="20" y="700" width="400" height="40" rx="6" fill="white" stroke="#e5e7eb"/>
  <line x1="35" y1="720" x2="65" y2="720" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="70" y="724" fill="#6b7280" font-size="10">Relasi FK</text>
  <text x="150" y="724" fill="#374151" font-size="10">🔑 Primary Key</text>
  <text x="240" y="724" fill="#1d4ed8" font-size="10">🔗 Foreign Key</text>
  <text x="330" y="724" fill="#374151" font-size="10">Semua tabel: utf8mb4</text>
</svg>
